{% extends "base.html" %}{% block content %}<h1>Inventory</h1><form class="panel form grid" method="post"><label>SKU<input name="sku" required></label><label>Part / Product<input name="name" required></label><label>Category<input name="category"></label><label>Compatible models<input name="compatible_models"></label><label>Quantity<input type="number" name="quantity" value="0"></label><label>Reorder level<input type="number" name="reorder_level" value="2"></label><label>Cost price<input type="number" name="cost_price"></label><label>Selling price<input type="number" name="selling_price"></label><label>Branch<select name="branch_id">{% for b in branches %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select></label><button class="btn full">Add Stock Item</button></form><div class="panel"><table><tr><th>SKU</th><th>Item</th><th>Qty</th><th>Reorder</th><th>Cost</th><th>Sell</th><th>Adjust</th></tr>{% for i in items %}<tr><td>{{i.sku}}</td><td>{{i.name}}</td><td>{{i.quantity}}</td><td>{{i.reorder_level}}</td><td>{{i.cost_price}}</td><td>{{i.selling_price}}</td><td><form method="post" action="{{url_for('adjust_stock',item_id=i.id)}}"><input class="tiny" type="number" name="delta" placeholder="+/-"><button>Apply</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
