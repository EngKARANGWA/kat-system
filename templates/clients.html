{% extends "base.html" %}{% block content %}<div class="panel-head"><h1>Clients</h1><a class="btn" href="{{url_for('new_client')}}">+ Register</a></div><form class="search"><input name="q" value="{{q}}" placeholder="Search name or phone"><button>Search</button></form><div class="panel"><table><tr><th>Name</th><th>Phone</th><th>Email</th><th>Repairs</th></tr>{% for c in clients %}<tr><td>{{c.full_name}}</td><td>{{c.phone}}</td><td>{{c.email or "—"}}</td><td>{{c.repairs|length}}</td></tr>{% endfor %}</table></div>{% endblock %}
